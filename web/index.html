<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="resku">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>resku</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Configure WebAssembly & WebGPU Bridge Pinning -->
  <script>
    // Pin compilation assets to stable release tags
    window.LLAMADART_WASM_BINARY_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.46/dist/mlc-common.wasm";
    window.LLAMADART_WEBGPU_ACCELERATOR = "webgpu";
    
    // Origin-scoped cache utility to prevent re-downloads of GGUF model files
    async function getOrFetchCachedModel(url, filename) {
      const cacheName = 'resku-local-models';
      const cache = await caches.open(cacheName);
      
      const cachedResponse = await cache.match(url);
      if (cachedResponse) {
        console.log('Model loaded from browser cache storage API.');
        return await cachedResponse.blob();
      }
      
      console.log('Model not in cache. Downloading via background fetch...');
      const response = await fetch(url);
      
      if (!response.ok) throw new Error('Failed to fetch model weights');
      
      // Clone response to cache it while streaming to browser storage
      await cache.put(url, response.clone());
      return await response.blob();
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
